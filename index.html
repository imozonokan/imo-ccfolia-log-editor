<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ココフォリア・そのままログ整形えでぃたー</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SortableJS CDN (ドラッグ＆ドロップ用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <style>
    .drag-handle {
      cursor: grab;
    }
    .drag-handle:active {
      cursor: grabbing;
    }
    .sortable-ghost {
      opacity: 0.4;
      background-color: #f3f4f6;
      border: 2px dashed #9ca3af;
    }
    /* パレット用カラースクエアのスタイル */
    .color-swatch {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.2);
      transition: transform 0.1s ease;
    }
    .color-swatch:hover {
      transform: scale(1.15);
    }
  </style>
</head>
<!-- h-screen と overflow-hidden を指定して画面全体のスクロールを抑止 -->
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden">

  <!-- ヘッダー -->
  <header class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center shrink-0">
    <h1 class="text-xl font-bold">ココフォリア・そのままログ整形えでぃたー</h1>
    <div class="flex items-center space-x-3">
      <label class="bg-indigo-700 hover:bg-indigo-600 px-4 py-2 rounded cursor-pointer transition text-sm">
        ログファイルを読み込む
        <input type="file" id="fileInput" accept=".html" class="hidden" />
      </label>
      <button id="exportBtn" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded text-sm font-semibold transition hidden">
        HTMLログを出力して保存
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 flex overflow-hidden">
    <!-- サイドバー (コントロールパネル) -->
    <aside id="sidebar" class="bg-white border-r border-gray-200 p-4 flex flex-col justify-between overflow-y-auto hidden shrink-0" style="width: 22rem;">
      <div class="space-y-5">
        <!-- タブ表示切り替え -->
        <div>
          <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">タブ表示/出力切り替え</h2>
          <div id="tabFilters" class="space-y-2">
            <!-- 動的に生成 -->
          </div>
        </div>

        <!-- 一括処理・複数操作 -->
        <div class="space-y-3">
          <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">一括処理・成形ツール</h2>
          
          <!-- 集中削除モードスイッチ -->
          <div class="bg-red-50 border border-red-200 p-2.5 rounded-md">
            <label class="flex items-center justify-between cursor-pointer">
              <span class="text-xs font-bold text-red-800">集中削除モード</span>
              <input type="checkbox" id="fastDeleteToggle" class="sr-only peer">
              <div class="relative w-9 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-red-600"></div>
            </label>
            <p class="text-[10px] text-red-600 mt-1 leading-tight">ONにすると削除時の確認ダイアログをスキップして即削除します。</p>
          </div>

          <!-- 選択操作エリア -->
          <div class="bg-gray-50 p-2.5 rounded border border-gray-200 space-y-2">
            <div class="flex justify-between items-center text-xs text-gray-600 font-semibold">
              <span>選択中の発言:</span>
              <span id="selectedCountLabel" class="text-indigo-600 font-bold">0 件</span>
            </div>
            <div class="flex space-x-1.5">
              <button id="selectAllBtn" class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs py-1.5 rounded font-semibold transition">
                表示中を全選択
              </button>
              <button id="deselectAllBtn" class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs py-1.5 rounded font-semibold transition">
                選択解除
              </button>
            </div>
            <button id="deleteSelectedBtn" class="w-full bg-red-600 hover:bg-red-500 disabled:bg-gray-300 text-white text-xs py-1.5 rounded font-semibold transition shadow-sm" disabled>
              選択した発言を一括削除
            </button>
          </div>

          <!-- ダイス判定簡略化 (シークレット完全対応) -->
          <button id="simplifyDiceBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs py-2 rounded font-semibold transition shadow-sm flex items-center justify-center space-x-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            <span>ダイス成否判定を一括簡略化 (s対応)</span>
          </button>

          <!-- 成形処理 (スラッシュ削除) -->
          <button id="removeSlashBtn" class="w-full bg-amber-600 hover:bg-amber-500 text-white text-xs py-2 rounded font-semibold transition shadow-sm">
            文末・セリフ直後の「/」を一括削除
          </button>

          <!-- 文字列一括置換・削除ツール -->
          <details class="bg-gray-50 border border-gray-200 rounded p-2 text-xs">
            <summary class="font-bold text-gray-700 cursor-pointer select-none">文字列の一括置換・一括削除</summary>
            <div class="mt-2 space-y-2 pt-1 border-t border-gray-200">
              <div>
                <label class="text-[11px] text-gray-500 font-semibold block">検索する文字列</label>
                <input type="text" id="replaceSearchInput" class="w-full border rounded px-2 py-1 text-xs" placeholder="置換/削除したい文字列" />
              </div>
              <div>
                <label class="text-[11px] text-gray-500 font-semibold block">置換後の文字列 (空欄で一括削除)</label>
                <input type="text" id="replaceWithInput" class="w-full border rounded px-2 py-1 text-xs" placeholder="空欄の場合は検索文字を削除" />
              </div>
              <button id="executeReplaceBtn" class="w-full bg-teal-600 hover:bg-teal-500 text-white text-xs py-1.5 rounded font-semibold transition shadow-sm">
                文字列を一括置換 / 削除
              </button>
            </div>
          </details>

          <!-- 指定文字列を含む発言の一括削除 -->
          <details class="bg-gray-50 border border-red-200 rounded p-2 text-xs">
            <summary class="font-bold text-red-800 cursor-pointer select-none">発言の条件一括削除 (保護機能付)</summary>
            <div class="mt-2 space-y-2 pt-1 border-t border-red-100">
              <div>
                <label class="text-[11px] text-gray-600 font-semibold block">削除対象にする文字列</label>
                <input type="text" id="filterDeleteInput" class="w-full border rounded px-2 py-1 text-xs" placeholder="例: 失敗❌" />
              </div>
              <div>
                <label class="text-[11px] text-gray-600 font-semibold block">保護する文字列 (これを含めば除外)</label>
                <input type="text" id="filterProtectInput" class="w-full border rounded px-2 py-1 text-xs" placeholder="例: 「 (セリフは残す等)" />
              </div>
              <button id="executeFilterDeleteBtn" class="w-full bg-red-600 hover:bg-red-500 text-white text-xs py-1.5 rounded font-semibold transition shadow-sm">
                条件に一致する発言を一括削除
              </button>
            </div>
          </details>
        </div>

        <!-- キャラクター一括操作 -->
        <div>
          <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">キャラクター一覧と操作</h2>
          <div id="charList" class="space-y-3 max-h-40 overflow-y-auto pr-1 border border-gray-100 p-2 rounded">
            <!-- 動的に生成 -->
          </div>
        </div>

        <!-- 新規発言追加 -->
        <div class="border-t border-gray-200 pt-4">
          <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">新規発言の追加</h2>
          
          <!-- 挿入位置指定用のインジケーター（挿入モード時のみ表示） -->
          <div id="insertIndicator" class="hidden bg-blue-50 border border-blue-200 rounded p-2 mb-3 text-xs flex justify-between items-center text-blue-800">
            <div>
              <span class="font-bold">挿入位置:</span> <span id="insertTargetLabel"></span> の後ろ
            </div>
            <button id="cancelInsertBtn" class="text-red-500 hover:text-red-700 font-bold hover:underline">
              キャンセル
            </button>
          </div>

          <div class="space-y-2">
            <div>
              <label class="text-xs text-gray-500 font-semibold">発言者名</label>
              <input type="text" id="addName" class="w-full border rounded px-2 py-1 text-sm" placeholder="発言者名を入力" />
            </div>
            <div class="flex space-x-2">
              <div class="w-1/2">
                <label class="text-xs text-gray-500 font-semibold">タブ</label>
                <select id="addTab" class="w-full border rounded px-2 py-1 text-sm">
                  <option value="main">[main]</option>
                  <option value="sub">[sub]</option>
                  <option value="other">[other]</option>
                  <option value="info">[info]</option>
                  <option value="system">[system]</option>
                </select>
              </div>
              <div class="w-1/2">
                <label class="text-xs text-gray-500 font-semibold">色指定 (HEX)</label>
                <input type="text" id="addTextColor" class="w-full border rounded px-2 py-1 text-sm font-mono" value="#888888" placeholder="#888888" />
              </div>
            </div>
            <!-- 追加画面用カラーパレットグリッド -->
            <div>
              <label class="text-xs text-gray-500 font-semibold block mb-1">パレットから色を選ぶ</label>
              <div id="addPaletteGrid" class="grid grid-cols-8 gap-1 p-1 bg-gray-50 rounded border"></div>
            </div>
            <div>
              <label class="text-xs text-gray-500 font-semibold">本文 (改行可)</label>
              <textarea id="addContent" rows="3" class="w-full border rounded px-2 py-1 text-sm" placeholder="発言内容を入力"></textarea>
            </div>
            <button id="addLogBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs py-2 rounded font-semibold transition">
              末尾に発言を追加する
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- エディターメイン画面 -->
    <section class="flex-1 flex flex-col bg-gray-100 overflow-hidden">
      <!-- 案内表示 -->
      <div id="welcomeScreen" class="flex-1 flex flex-col justify-center items-center p-8 text-center">
        <svg class="w-16 h-16 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <p class="text-lg font-semibold text-gray-600">ココフォリアから出力したHTMLログを選択するか、ここにドラッグ＆ドロップしてください。</p>
        <p class="text-xs text-gray-400 mt-2">※HTMLデータは完全にローカルで安全にパースされ、外部送信されません。</p>
      </div>

      <!-- ログリスト -->
      <div id="editorContainer" class="flex-1 overflow-y-auto p-4 space-y-2 hidden">
        <div id="logList" class="space-y-2">
          <!-- ログ要素が動的に配置されます -->
        </div>
      </div>
    </section>
  </main>

  <!-- カラー変更用ダイアログモーダル -->
  <div id="colorModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-lg shadow-xl p-6 w-80">
      <h3 class="font-bold text-lg mb-2 text-gray-800">カラーの一括変更</h3>
      <p class="text-sm text-gray-500 mb-3">発言者: <span id="modalTargetChar" class="font-semibold text-indigo-600"></span></p>
      
      <!-- 安全なカラーパレットグリッド -->
      <div class="mb-4">
        <label class="text-xs text-gray-400 font-semibold block mb-1">パレット選択</label>
        <div id="modalPaletteGrid" class="grid grid-cols-6 gap-1.5 p-2 bg-gray-50 rounded border"></div>
      </div>

      <div class="mb-5">
        <label class="text-xs text-gray-400 font-semibold block mb-1">カラーコード指定</label>
        <input type="text" id="modalColorText" class="border rounded px-3 py-2 w-full text-sm font-mono focus:ring-1 focus:ring-indigo-500" placeholder="#888888" />
      </div>

      <div class="flex justify-end space-x-2">
        <button id="modalCancelBtn" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded transition">キャンセル</button>
        <button id="modalConfirmBtn" class="px-4 py-2 text-sm bg-indigo-600 text-white hover:bg-indigo-500 rounded font-semibold transition">変更を適用</button>
      </div>
    </div>
  </div>

  <script>
    // 安全な定義済みカラー（24色）
    const presetColors = [
      '#000000', '#4b5563', '#888888', '#d1d5db', '#ffffff',
      '#ef4444', '#f87171', '#fca5a5', '#f97316', '#fb923c',
      '#eab308', '#facc15', '#22c55e', '#4ade80', '#10b981',
      '#06b6d4', '#2563eb', '#3b82f6', '#60a5fa', '#6366f1',
      '#818cf8', '#a855f7', '#c084fc', '#ec4899'
    ];

    let logs = []; 
    let activeTabs = new Set(['main', 'sub', 'other', 'info', 'system']); 
    let currentEditIndex = null;
    let insertTargetIndex = null; 
    let loadedFileName = ''; 
    let fastDeleteMode = false; 

    // DOM要素取得
    const fileInput = document.getElementById('fileInput');
    const exportBtn = document.getElementById('exportBtn');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const sidebar = document.getElementById('sidebar');
    const editorContainer = document.getElementById('editorContainer');
    const logList = document.getElementById('logList');
    const tabFilters = document.getElementById('tabFilters');
    const charList = document.getElementById('charList');

    // 複数操作・集中削除用DOM
    const fastDeleteToggle = document.getElementById('fastDeleteToggle');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const deselectAllBtn = document.getElementById('deselectAllBtn');
    const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
    const selectedCountLabel = document.getElementById('selectedCountLabel');

    // 追加機能用DOM
    const simplifyDiceBtn = document.getElementById('simplifyDiceBtn');
    const replaceSearchInput = document.getElementById('replaceSearchInput');
    const replaceWithInput = document.getElementById('replaceWithInput');
    const executeReplaceBtn = document.getElementById('executeReplaceBtn');
    const filterDeleteInput = document.getElementById('filterDeleteInput');
    const filterProtectInput = document.getElementById('filterProtectInput');
    const executeFilterDeleteBtn = document.getElementById('executeFilterDeleteBtn');

    // 新規追加エリア用
    const addTextColor = document.getElementById('addTextColor');
    const addPaletteGrid = document.getElementById('addPaletteGrid');
    const addLogBtn = document.getElementById('addLogBtn');
    const insertIndicator = document.getElementById('insertIndicator');
    const insertTargetLabel = document.getElementById('insertTargetLabel');
    const cancelInsertBtn = document.getElementById('cancelInsertBtn');

    // モーダル用
    const colorModal = document.getElementById('colorModal');
    const modalTargetChar = document.getElementById('modalTargetChar');
    const modalPaletteGrid = document.getElementById('modalPaletteGrid');
    const modalColorText = document.getElementById('modalColorText');
    const modalCancelBtn = document.getElementById('modalCancelBtn');
    const modalConfirmBtn = document.getElementById('modalConfirmBtn');
    let activeColorTargetName = '';

    // RGB形式のカラー文字列をHEX(#RRGGBB)形式に変換するヘルパー関数
    function rgbToHex(colorStr) {
      if (!colorStr) return '#888888';
      const trimmed = colorStr.trim();
      if (trimmed.startsWith('#')) return trimmed;
      
      const match = trimmed.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*[\d.]+)?\)$/i);
      if (match) {
        const r = parseInt(match[1], 10).toString(16).padStart(2, '0');
        const g = parseInt(match[2], 10).toString(16).padStart(2, '0');
        const b = parseInt(match[3], 10).toString(16).padStart(2, '0');
        return `#${r}${g}${b}`.toLowerCase();
      }
      return trimmed;
    }

    // カラーグリッド初期化
    function initPaletteGrids() {
      addPaletteGrid.innerHTML = '';
      presetColors.forEach(color => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'color-swatch';
        btn.style.backgroundColor = color;
        btn.title = color;
        btn.addEventListener('click', () => {
          addTextColor.value = color;
        });
        addPaletteGrid.appendChild(btn);
      });

      modalPaletteGrid.innerHTML = '';
      presetColors.forEach(color => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'color-swatch w-full h-7 rounded border border-black/10';
        btn.style.backgroundColor = color;
        btn.title = color;
        btn.addEventListener('click', () => {
          modalColorText.value = color;
        });
        modalPaletteGrid.appendChild(btn);
      });
    }

    initPaletteGrids();

    fastDeleteToggle.addEventListener('change', (e) => {
      fastDeleteMode = e.target.checked;
      renderLogs();
    });

    const sortable = new Sortable(logList, {
      handle: '.drag-handle',
      animation: 150,
      ghostClass: 'sortable-ghost',
      onEnd: function () {
        const newLogs = [];
        logList.querySelectorAll('[data-index]').forEach((el) => {
          const index = parseInt(el.dataset.index, 10);
          newLogs.push(logs[index]);
        });
        logs = newLogs;
        cancelInsertMode();
        renderLogs(); 
      }
    });

    fileInput.addEventListener('change', handleFileSelect);

    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        if (file.name.endsWith('.html')) {
          loadedFileName = file.name;
          const reader = new FileReader();
          reader.onload = function(evt) {
            parseAndLoadHTML(evt.target.result);
          };
          reader.readAsText(file);
        }
      }
    });

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      loadedFileName = file.name;
      const reader = new FileReader();
      reader.onload = function(evt) {
        parseAndLoadHTML(evt.target.result);
      };
      reader.readAsText(file);
    }

    function parseAndLoadHTML(htmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');
      const paragraphs = doc.querySelectorAll('body > p');
      
      logs = [];
      activeTabs = new Set(['main', 'sub', 'other', 'info', 'system']);

      paragraphs.forEach(p => {
        const rawColor = p.style.color || '#888888';
        const color = rgbToHex(rawColor);
        
        const spans = p.querySelectorAll('span');
        if (spans.length >= 3) {
          const tabRaw = spans[0].textContent;
          const tab = tabRaw.replace('[', '').replace(']', '').trim();
          const name = spans[1].textContent.trim();
          const content = spans[2].innerHTML.replace(/^\s+|\s+$/g, '');
          
          logs.push({
            color: color,
            tab: tab,
            name: name,
            content: content,
            selected: false
          });
        }
      });

      if (logs.length > 0) {
        welcomeScreen.classList.add('hidden');
        sidebar.classList.remove('hidden');
        editorContainer.classList.remove('hidden');
        exportBtn.classList.remove('hidden');
        renderTabFilters();
        renderLogs();
      } else {
        alert('有効なココフォリアのHTMLログファイルが見つかりませんでした。');
      }
    }

    function renderTabFilters() {
      const tabSet = new Set();
      logs.forEach(log => tabSet.add(log.tab));
      
      tabFilters.innerHTML = '';
      tabSet.forEach(tab => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between text-sm bg-gray-50 p-2 rounded';
        
        const label = document.createElement('label');
        label.className = 'flex items-center space-x-2 cursor-pointer w-full';
        
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = activeTabs.has(tab);
        checkbox.className = 'rounded text-indigo-600 focus:ring-indigo-500';
        checkbox.addEventListener('change', () => {
          if (checkbox.checked) {
            activeTabs.add(tab);
          } else {
            activeTabs.delete(tab);
          }
          renderLogs();
        });
        
        const span = document.createElement('span');
        span.textContent = `[${tab}]`;
        span.className = 'font-mono text-xs font-semibold';
        
        label.appendChild(checkbox);
        label.appendChild(span);
        div.appendChild(label);
        tabFilters.appendChild(div);
      });
    }

    function renderCharList() {
      const charsMap = new Map();
      logs.forEach(log => {
        if (!activeTabs.has(log.tab)) return;
        if (!charsMap.has(log.name)) {
          charsMap.set(log.name, log.color);
        }
      });

      charList.innerHTML = '';
      if (charsMap.size === 0) {
        charList.innerHTML = '<p class="text-xs text-gray-400">表示中のキャラクターはいません</p>';
        return;
      }

      charsMap.forEach((color, name) => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between bg-gray-50 p-2 rounded text-xs space-x-1';

        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.value = name;
        nameInput.className = 'border border-gray-300 rounded px-1.5 py-0.5 w-28 text-xs focus:ring-1 focus:ring-indigo-500';
        nameInput.addEventListener('change', () => {
          const newName = nameInput.value.trim();
          if (newName && newName !== name) {
            logs.forEach(log => {
              if (log.name === name) {
                log.name = newName;
              }
              if (log.content.includes(name)) {
                log.content = log.content.split(name).join(newName);
              }
            });
            renderLogs();
          }
        });

        const actions = document.createElement('div');
        actions.className = 'flex items-center space-x-1';

        const colorIndicator = document.createElement('button');
        colorIndicator.className = 'w-5 h-5 rounded border border-black/20 shadow-sm transition transform hover:scale-110';
        colorIndicator.style.backgroundColor = color;
        colorIndicator.title = "カラーを一括変更";
        colorIndicator.addEventListener('click', () => {
          openColorModal(name, color);
        });

        actions.appendChild(colorIndicator);
        div.appendChild(nameInput);
        div.appendChild(actions);
        charList.appendChild(div);
      });
    }

    function updateSelectionUI() {
      const selectedLogs = logs.filter(log => log.selected);
      const count = selectedLogs.length;
      selectedCountLabel.textContent = `${count} 件`;
      deleteSelectedBtn.disabled = (count === 0);
    }

    selectAllBtn.addEventListener('click', () => {
      logs.forEach(log => {
        if (activeTabs.has(log.tab)) {
          log.selected = true;
        }
      });
      renderLogs();
    });

    deselectAllBtn.addEventListener('click', () => {
      logs.forEach(log => {
        log.selected = false;
      });
      renderLogs();
    });

    deleteSelectedBtn.addEventListener('click', () => {
      const selectedCount = logs.filter(l => l.selected).length;
      if (selectedCount === 0) return;

      if (fastDeleteMode || confirm(`選択された ${selectedCount} 件の発言を一括削除します。よろしいですか？`)) {
        logs = logs.filter(log => !log.selected);
        cancelInsertMode();
        renderLogs();
      }
    });

    function openColorModal(name, currentColor) {
      activeColorTargetName = name;
      modalTargetChar.textContent = name;
      modalColorText.value = rgbToHex(currentColor);
      colorModal.classList.remove('hidden');
    }

    modalCancelBtn.addEventListener('click', () => {
      colorModal.classList.add('hidden');
    });

    modalConfirmBtn.addEventListener('click', () => {
      let targetColor = modalColorText.value.trim();
      
      if (!targetColor.startsWith('#')) {
        targetColor = '#' + targetColor;
      }
      if (/^#[0-9A-F]{6}$/i.test(targetColor) || /^#[0-9A-F]{3}$/i.test(targetColor)) {
        logs.forEach(log => {
          if (log.name === activeColorTargetName) {
            log.color = targetColor.toLowerCase();
          }
        });
        colorModal.classList.add('hidden');
        renderLogs();
      } else {
        alert('正しいカラーコード（例: #888888）を入力してください。');
      }
    });

    function renderLogs() {
      currentEditIndex = null;
      logList.innerHTML = '';

      logs.forEach((log, index) => {
        if (!activeTabs.has(log.tab)) return;

        const isCurrentlySelected = (insertTargetIndex === index);

        const p = document.createElement('div');
        let bgStyle = 'bg-white border-gray-200 hover:border-indigo-300';
        if (log.selected) {
          bgStyle = 'bg-amber-50/80 border-amber-300 ring-1 ring-amber-200';
        } else if (isCurrentlySelected) {
          bgStyle = 'border-blue-500 ring-2 ring-blue-100 bg-blue-50/10';
        }

        p.className = `flex items-start border rounded p-2.5 shadow-sm space-x-2 relative group transition duration-150 ${bgStyle}`;
        p.dataset.index = index;

        const selectCheckbox = document.createElement('input');
        selectCheckbox.type = 'checkbox';
        selectCheckbox.checked = !!log.selected;
        selectCheckbox.className = 'rounded text-amber-600 focus:ring-amber-500 cursor-pointer mt-1 shrink-0';
        selectCheckbox.addEventListener('change', (e) => {
          log.selected = e.target.checked;
          updateSelectionUI();
          renderLogs();
        });

        const handle = document.createElement('div');
        handle.className = 'drag-handle text-gray-400 p-1 hover:text-gray-600 transition shrink-0';
        handle.innerHTML = `
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 8h16M4 16h16"></path>
          </svg>
        `;

        const tabBadge = document.createElement('span');
        tabBadge.className = 'font-mono text-xs font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-600 border shrink-0 mt-0.5';
        tabBadge.textContent = `[${log.tab}]`;

        const contentBox = document.createElement('div');
        contentBox.className = 'flex-1 space-y-1 min-w-0';

        const header = document.createElement('div');
        header.className = 'flex items-center space-x-2';
        
        const nameSpan = document.createElement('span');
        nameSpan.className = 'font-bold text-sm';
        nameSpan.style.color = log.color;
        nameSpan.textContent = log.name;

        header.appendChild(nameSpan);

        const bodyText = document.createElement('div');
        bodyText.className = 'text-sm text-gray-700 whitespace-pre-wrap leading-relaxed break-all';
        bodyText.innerHTML = log.content;

        contentBox.appendChild(header);
        contentBox.appendChild(bodyText);

        const controlPanel = document.createElement('div');
        controlPanel.className = 'flex items-center space-x-1 shrink-0 self-center opacity-0 group-hover:opacity-100 transition duration-150';

        const insertBtn = document.createElement('button');
        insertBtn.className = 'p-1 hover:bg-blue-50 rounded text-blue-600 transition';
        insertBtn.title = 'この発言の直後に新規発言を挿入';
        insertBtn.innerHTML = `
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
        `;
        insertBtn.addEventListener('click', () => {
          setInsertTarget(index, log.name);
        });

        const editBtn = document.createElement('button');
        editBtn.className = 'p-1 hover:bg-gray-100 rounded text-indigo-600 transition';
        editBtn.title = '編集';
        editBtn.innerHTML = `
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
          </svg>
        `;
        editBtn.addEventListener('click', () => {
          enterEditMode(p, index, log, bodyText);
        });

        const deleteBtn = document.createElement('button');
        if (fastDeleteMode) {
          deleteBtn.className = 'p-1 bg-red-100 hover:bg-red-200 rounded text-red-600 font-bold transition';
          deleteBtn.title = '【集中削除】確認なしで即削除';
        } else {
          deleteBtn.className = 'p-1 hover:bg-red-50 rounded text-red-500 transition';
          deleteBtn.title = '削除';
        }
        deleteBtn.innerHTML = `
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
          </svg>
        `;
        deleteBtn.addEventListener('click', () => {
          if (fastDeleteMode || confirm('この発言を削除しますか？')) {
            logs.splice(index, 1);
            cancelInsertMode();
            renderLogs();
          }
        });

        controlPanel.appendChild(insertBtn);
        controlPanel.appendChild(editBtn);
        controlPanel.appendChild(deleteBtn);

        p.appendChild(selectCheckbox);
        p.appendChild(handle);
        p.appendChild(tabBadge);
        p.appendChild(contentBox);
        p.appendChild(controlPanel);

        logList.appendChild(p);
      });

      updateSelectionUI();
      renderCharList();
    }

    function setInsertTarget(index, charName) {
      insertTargetIndex = index;
      insertTargetLabel.textContent = `No.${index + 1} [${charName}]`;
      insertIndicator.classList.remove('hidden');
      addLogBtn.textContent = '指定位置に発言を挿入する';
      addLogBtn.className = 'w-full bg-blue-600 hover:bg-blue-500 text-white text-xs py-2 rounded font-semibold transition';
      
      renderLogs();
      document.getElementById('addName').focus();
    }

    function cancelInsertMode() {
      insertTargetIndex = null;
      insertIndicator.classList.add('hidden');
      addLogBtn.textContent = '末尾に発言を追加する';
      addLogBtn.className = 'w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs py-2 rounded font-semibold transition';
    }

    cancelInsertBtn.addEventListener('click', (e) => {
      e.preventDefault();
      cancelInsertMode();
      renderLogs();
    });

    function enterEditMode(pElement, index, log, bodyTextElement) {
      if (currentEditIndex !== null) return; 
      currentEditIndex = index;

      const editContainer = document.createElement('div');
      editContainer.className = 'space-y-2 mt-1';

      const textarea = document.createElement('textarea');
      textarea.className = 'w-full border rounded px-2 py-1.5 text-sm focus:ring-1 focus:ring-indigo-500';
      textarea.rows = 3;
      textarea.value = log.content.replace(/<br\s*\/?>/gi, '\n');

      const actionDiv = document.createElement('div');
      actionDiv.className = 'flex space-x-2 justify-end';

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'px-3 py-1 text-xs bg-gray-100 hover:bg-gray-200 rounded text-gray-600 transition';
      cancelBtn.textContent = 'キャンセル';
      cancelBtn.addEventListener('click', () => {
        currentEditIndex = null;
        renderLogs();
      });

      const saveBtn = document.createElement('button');
      saveBtn.className = 'px-3 py-1 text-xs bg-indigo-600 hover:bg-indigo-500 text-white rounded font-semibold transition';
      saveBtn.textContent = '保存';
      saveBtn.addEventListener('click', () => {
        log.content = textarea.value.replace(/\n/g, '<br>');
        currentEditIndex = null;
        renderLogs();
      });

      actionDiv.appendChild(cancelBtn);
      actionDiv.appendChild(saveBtn);
      editContainer.appendChild(textarea);
      editContainer.appendChild(actionDiv);

      bodyTextElement.innerHTML = '';
      bodyTextElement.appendChild(editContainer);
    }

    addLogBtn.addEventListener('click', () => {
      const name = document.getElementById('addName').value.trim();
      const tab = document.getElementById('addTab').value;
      let color = addTextColor.value.trim();
      const contentRaw = document.getElementById('addContent').value;

      if (!name) {
        alert('発言者名を入力してください。');
        return;
      }
      if (!contentRaw) {
        alert('発言内容を入力してください。');
        return;
      }

      if (!color.startsWith('#')) {
        color = '#' + color;
      }
      if (!/^#[0-9A-F]{6}$/i.test(color) && !/^#[0-9A-F]{3}$/i.test(color)) {
        color = '#888888'; 
      }

      const content = contentRaw.replace(/\n/g, '<br>');

      const newLog = {
        color: color.toLowerCase(),
        tab: tab,
        name: name,
        content: content,
        selected: false
      };

      if (insertTargetIndex !== null) {
        logs.splice(insertTargetIndex + 1, 0, newLog);
        const nextInsertIndex = insertTargetIndex + 1;
        cancelInsertMode();
        setInsertTarget(nextInsertIndex, name);
      } else {
        logs.push(newLog);
        renderLogs();
        editorContainer.scrollTop = editorContainer.scrollHeight;
      }

      document.getElementById('addContent').value = '';
    });

    document.getElementById('removeSlashBtn').addEventListener('click', () => {
      if (logs.length === 0) {
        alert('ログデータが読み込まれていません。');
        return;
      }

      if (confirm('すべての発言において、文末および「」や』などの閉じ括弧直後にある「/」や「／」を一括で削除します。よろしいですか？')) {
        let count = 0;
        logs.forEach(log => {
          const original = log.content;
          log.content = log.content.replace(/([」』])[/／]/g, '$1');
          log.content = log.content.replace(/[/／](\s*(?:<br\s*\/?>\s*)*)$/i, '$1');
          if (original !== log.content) {
            count++;
          }
        });
        
        renderLogs();
        alert(`${count}件の発言から不要な「/」を削除しました。`);
      }
    });

    // 文字列の一括置換／一括削除
    executeReplaceBtn.addEventListener('click', () => {
      if (logs.length === 0) {
        alert('ログデータが読み込まれていません。');
        return;
      }

      const searchStr = replaceSearchInput.value;
      const replaceWith = replaceWithInput.value;

      if (!searchStr) {
        alert('検索する文字列を入力してください。');
        return;
      }

      const actionText = replaceWith ? `「${replaceWith}」に置換` : '削除';
      if (!confirm(`全発言中の「${searchStr}」を一括で${actionText}します。よろしいですか？`)) {
        return;
      }

      let count = 0;
      logs.forEach(log => {
        if (log.content.includes(searchStr)) {
          log.content = log.content.split(searchStr).join(replaceWith);
          count++;
        }
      });

      renderLogs();
      alert(`${count}件の発言に含まれる「${searchStr}」を${actionText}しました。`);
    });

    // ==========================================
    // ダイス判定ロールの簡略化 (シークレット判定対応)
    // ==========================================
    function simplifyDiceRoll(content) {
      // 不等号パターン（<=, &lt;=, ＜＝, ≦ 等）
      const lePattern = '(?:<=|&lt;=|＜＝|≦)';

      // コマンド判定:
      // 先頭の s / S は任意（sCCB, CCB, sCC, SCC, sCBRB, CBRB, sRESB, RESB, s1D100, 1D100 に完全対応）
      // コマンドと不等号や括弧の間の空白も許容
      const cmdRegex = new RegExp(
        `^\\s*(s?(?:ccb|cc|cbrb|resb|1d100))\\s*(?:${lePattern}\\s*([^\\s<【（(「\\[［]+)|[（(]([^)）]+)[)）])?`,
        'i'
      );

      // ココフォリアの成否判定ロールの展開部分 (1d100<=目標値) ＞ 出目 ＞ 成否
      // 全角半角カッコ、全角半角不等号、全角半角「＞ / >」に対応
      const rollRegex = new RegExp(
        `[\\(（]1[dD]100\\s*${lePattern}\\s*([^()（）]+)[\\)）]\\s*[＞>]\\s*(.+)$`,
        's'
      );

      const cmdMatch = content.match(cmdRegex);
      const rollMatch = content.match(rollRegex);

      // コマンドと成否ロール展開部の両方が存在しない場合は対象外（単発1d100等は除外）
      if (!cmdMatch || !rollMatch) return null;

      // コマンド名から先頭の 's' や 'S' を除いて種別を正規化
      let cmdType = cmdMatch[1].toLowerCase();
      if (cmdType.startsWith('s')) {
        cmdType = cmdType.slice(1);
      }

      const cmdArg = cmdMatch[2] || cmdMatch[3] || '';
      const rollTarget = rollMatch[1].trim(); // 展開された目標値 (例: 70, 20)
      const rollResult = rollMatch[2].trim(); // 出目と結果 (例: 95 ＞ 失敗)

      // 目標値の取得 (CBRBで引数がある場合は引数を優先、その他は展開後の目標値)
      let targetVal = rollTarget;
      if (cmdType === 'cbrb' && cmdArg) {
        targetVal = cmdArg.trim();
      }

      // コマンドと展開部分の間にある付加文章（コメント欄）を取得
      const afterCmdIndex = cmdMatch[0].length;
      const beforeRollIndex = content.lastIndexOf(rollMatch[0]);

      let rawComment = '';
      if (beforeRollIndex >= afterCmdIndex) {
        rawComment = content.substring(afterCmdIndex, beforeRollIndex);
      }

      // 余分な改行や空白の整理
      rawComment = rawComment.replace(/<br\s*\/?>/gi, ' ').replace(/\s+/g, ' ').trim();
      // 【】直後の「＞」との間にある不要な空白を除去
      rawComment = rawComment.replace(/(【.*?】)\s+([＞>])/g, '$1$2');

      // コメント部分のカッコ判定および追記処理
      let comment = '';
      if (!rawComment) {
        // コメント無記入時のデフォルト追記
        if (cmdType === 'cbrb') comment = '【複合ロール】';
        else if (cmdType === 'resb') comment = '【対抗】';
        else comment = '【成功値】';
      } else {
        // すでに【】が含まれている場合はそのまま参照
        if (/【.*?】/.test(rawComment)) {
          comment = rawComment;
        } else {
          // 【】以外の考えられるカッコペア（(),（）,「」,[],［］,≪≫,『』,〈〉,《》,{},｛｝,〔〕等）を【】に変換
          const bracketRegex = /[（(「\[［≪『〈《{｛〔](.*?)[)）\]］≫』〉》}｝〕]/g;
          if (bracketRegex.test(rawComment)) {
            comment = rawComment.replace(bracketRegex, '【$1】');
          } else {
            // カッコが一切使われていない場合は全体を【】で囲む
            comment = `【${rawComment}】`;
          }
        }
      }

      return `${targetVal}${comment} ${rollResult}`;
    }

    simplifyDiceBtn.addEventListener('click', () => {
      if (logs.length === 0) {
        alert('ログデータが読み込まれていません。');
        return;
      }

      if (confirm('CCB、CC、CBRB、RESB、1D100（sが付くシークレット判定を含む）の成否判定ダイスロールを一括で簡略化します。よろしいですか？\n※単発ダイスは保持されます。')) {
        let count = 0;
        logs.forEach(log => {
          const simplified = simplifyDiceRoll(log.content);
          if (simplified !== null && simplified !== log.content) {
            log.content = simplified;
            count++;
          }
        });

        renderLogs();
        alert(`${count}件のダイス判定ロール（シークレット判定含む）を簡略化しました。`);
      }
    });

    // 指定文字列を含む発言の一括削除 (保護機能付き)
    executeFilterDeleteBtn.addEventListener('click', () => {
      if (logs.length === 0) {
        alert('ログデータが読み込まれていません。');
        return;
      }

      const deleteKeyword = filterDeleteInput.value.trim();
      const protectKeyword = filterProtectInput.value.trim();

      if (!deleteKeyword) {
        alert('削除対象にする文字列を入力してください。');
        return;
      }

      let confirmMsg = `「${deleteKeyword}」を含む発言を一括削除します。`;
      if (protectKeyword) {
        confirmMsg += `\n※ただし「${protectKeyword}」を含む発言は保護され、削除されません。`;
      }
      confirmMsg += '\nよろしいですか？';

      if (!fastDeleteMode && !confirm(confirmMsg)) {
        return;
      }

      const beforeCount = logs.length;
      logs = logs.filter(log => {
        if (!log.content.includes(deleteKeyword)) {
          return true;
        }
        if (protectKeyword && log.content.includes(protectKeyword)) {
          return true;
        }
        return false;
      });

      const deletedCount = beforeCount - logs.length;
      cancelInsertMode();
      renderLogs();
      alert(`${deletedCount}件の発言を削除しました。`);
    });

    // ログ出力
    exportBtn.addEventListener('click', () => {
      let bodyContent = '';
      
      logs.forEach(log => {
        if (!activeTabs.has(log.tab)) return;

        bodyContent += `<p style="color:${log.color};">\n`;
        bodyContent += `  <span> [${log.tab}]</span>\n`;
        bodyContent += `  <span>${escapeHTML(log.name)}</span> :\n`;
        bodyContent += `  <span>\n    ${log.content.trim()} \n  </span>\n`;
        bodyContent += `</p>\n\n`;
      });

      const finalHTML = `<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>ccfolia - logs</title>
  </head>
  <body>
    ${bodyContent.trim()}
  </body>
</html>`;

      let exportFileName = 'edited_ccfolia_log.html';
      if (loadedFileName) {
        const baseName = loadedFileName.replace(/\.[^/.]+$/, "");
        exportFileName = `${baseName}_整形.html`;
      }

      const blob = new Blob([finalHTML], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = exportFileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    function escapeHTML(string) {
      return string.replace(/[&<>"']/g, function(match) {
        const escape = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        };
        return escape[match];
      });
    }
  </script>
</body>
</html>
